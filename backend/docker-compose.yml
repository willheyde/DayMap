version: "3.9"

services:

  api:
    build: .
    command: uvicorn Controller:app --host 0.0.0.0 --port 5000 --reload
    ports:
      - "5000:5000"
    volumes:
      - .:/app            # live-reload your code changes
      - db_data:/app/data # sqlite lives here, shared with scheduler
    env_file: .env
    restart: unless-stopped

  scheduler:
    build: .
    command: python scheduler.py
    volumes:
      - .:/app
      - db_data:/app/data  # same volume — both services read/write the same DB
    env_file: .env
    depends_on:
      - api
    restart: unless-stopped

volumes:
  db_data: